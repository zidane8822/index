<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>样子懂了</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          rice: '#f3ecda',
          riceDark: '#e6dcc1',
          ink: '#1a2030',
          gold: '#b58f45',
          cinnabar: '#b94133'
        }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'ZCOOL XiaoWei', 'Ma Shan Zheng', serif;
    color: #1a2030;
    background:
      radial-gradient(circle at 50% 30%, rgba(255, 242, 200, .9), rgba(243, 236, 218, 1) 40%, #e9ddbd 100%);
    overflow: hidden;
  }

  /* 宣纸纹理 */
  .rice-paper {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(120, 90, 40, .05) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(120, 90, 40, .04) 0 1px, transparent 1px 5px);
    box-shadow:
      inset 0 0 140px rgba(160, 120, 60, .18),
      inset 0 0 260px rgba(90, 70, 30, .12);
    pointer-events: none;
    z-index: 1;
  }

  /* 圆月 */
  .moon {
    position: absolute;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 40% 30%, #fffbe4, #f7e7b4 55%, #e7d29a);
    box-shadow:
      0 0 90px rgba(255, 220, 140, .55),
      0 0 180px rgba(255, 200, 110, .35),
      inset -14px -10px 30px rgba(180, 140, 70, .25);
    pointer-events: none;
    z-index: 2;
  }

  /* 远山 */
  .mountain {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 55%;
    z-index: 3;
    pointer-events: none;
  }
  .mountain svg { width: 100%; height: 100%; display: block; }

  /* 祥云 */
  .cloud {
    position: absolute;
    opacity: .45;
    color: #b58f45;
    z-index: 4;
    pointer-events: none;
  }
  .cloud svg { width: 200px; height: 80px; }
  .cloud.left { top: 28%; left: 4%; transform: rotate(-6deg); }
  .cloud.right { top: 32%; right: 6%; transform: rotate(4deg); }

  /* 主标题 */
  .brush-title {
    font-family: 'Ma Shan Zheng', 'ZCOOL XiaoWei', serif;
    font-size: clamp(42px, 7vw, 96px);
    letter-spacing: 0.15em;
    color: #1a2030;
    text-shadow:
      0 6px 20px rgba(0, 0, 0, .12),
      0 2px 4px rgba(0, 0, 0, .08);
    position: relative;
    z-index: 5;
  }

  /* 副标题 */
  .sub-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: clamp(16px, 1.6vw, 22px);
    letter-spacing: 0.3em;
    color: #2b3445;
    position: relative;
    z-index: 5;
  }

  /* 朱砂印章：flex 居中方案，竖排文字居中 */
  .seal {
    position: absolute;
    top: 18%;
    right: 26%;
    transform: rotate(-4deg);
    width: 52px;
    height: 72px;
    border: 3px solid #b94133;
    color: #b94133;
    font-family: 'Ma Shan Zheng', serif;
    font-size: 22px;
    border-radius: 4px;
    background: rgba(255, 255, 255, .4);
    box-shadow: 0 6px 18px rgba(185, 65, 51, .3);
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    letter-spacing: 4px;
  }

  /* 按钮 */
  .expect-btn {
    font-family: 'ZCOOL XiaoWei', serif;
    padding: 10px 28px;
    border-radius: 999px;
    background: linear-gradient(180deg, #c9a55c, #9c7a38);
    color: #fff;
    letter-spacing: 0.4em;
    font-size: 14px;
    box-shadow: 0 10px 24px rgba(156, 122, 56, .4);
    position: relative;
    z-index: 6;
    transition: all .3s ease;
    border: 1px solid rgba(255, 255, 255, .3);
  }
  .expect-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(156, 122, 56, .5);
  }

  /* 金色流光 */
  .gold-flow {
    position: absolute;
    left: -10%;
    top: 50%;
    width: 460px;
    height: 160px;
    background: radial-gradient(ellipse at center, rgba(217, 180, 100, .35), transparent 70%);
    filter: blur(8px);
    animation: flow 10s ease-in-out infinite;
    pointer-events: none;
    z-index: 4;
  }
  .gold-flow.two {
    top: 58%;
    left: auto;
    right: -10%;
    width: 360px;
    height: 140px;
    animation-delay: -5s;
  }
  @keyframes flow {
    0%, 100% { transform: translateX(0) translateY(0) scale(1); opacity: .45; }
    50% { transform: translateX(50px) translateY(-12px) scale(1.1); opacity: .75; }
  }

  /* 粒子 */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: radial-gradient(circle, #e9c778, transparent 70%);
    box-shadow: 0 0 10px #e9c778;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }

  /* 淡入 */
  .fade-in {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeIn 1.4s ease forwards;
  }
  .fade-in.delay-1 { animation-delay: .2s; }
  .fade-in.delay-2 { animation-delay: .5s; }
  .fade-in.delay-3 { animation-delay: .9s; }
  .fade-in.delay-4 { animation-delay: 1.2s; }
  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 768px) {
    .moon { width: 180px; height: 180px; top: 10%; }
    .seal { right: 18%; top: 14%; width: 44px; height: 60px; font-size: 19px; letter-spacing:3px; }
    .cloud svg { width: 140px; height: 60px; }
    .mountain { height: 48%; }
  }
</style>
</head>
<body>

<div class="rice-paper"></div>
<div class="moon"></div>

<div class="cloud left fade-in">
  <svg viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 55 Q45 20 80 35 Q110 10 140 30 Q170 20 185 45 Q175 60 140 58 Q100 68 70 58 Q40 62 20 55 Z"
          stroke="#b58f45" stroke-width="1.2" fill="rgba(181,143,69,.18)"/>
    <path d="M50 48 Q75 30 100 40" stroke="#b58f45" stroke-width="1" fill="none"/>
  </svg>
</div>

<div class="cloud right fade-in">
  <svg viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M25 58 Q50 24 85 38 Q115 14 148 34 Q175 28 190 50 Q178 64 142 62 Q102 72 72 62 Q42 66 25 58 Z"
          stroke="#b58f45" stroke-width="1" fill="rgba(181,143,69,.15)"/>
  </svg>
</div>

<div class="gold-flow"></div>
<div class="gold-flow two"></div>

<!-- 水墨山水 -->
<div class="mountain">
  <svg viewBox="0 0 1440 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="mountainGrad1" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#3b4556" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#1f2738" stop-opacity=".85"/>
      </linearGradient>
      <linearGradient id="mountainGrad2" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#586477" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#2f3a4d" stop-opacity=".75"/>
      </linearGradient>
      <linearGradient id="mountainGrad3" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#7c8798" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#455166" stop-opacity=".65"/>
      </linearGradient>
    </defs>

    <!-- 远山 -->
    <path d="M0 420 L120 360 L210 390 L320 310 L430 350 L560 280 L680 330 L820 290 L960 340 L1100 300 L1240 360 L1360 320 L1440 380 L1440 600 L0 600 Z"
          fill="url(#mountainGrad3)"/>

    <!-- 中山 -->
    <path d="M0 470 L90 430 L180 455 L290 380 L400 420 L520 360 L640 410 L780 370 L920 420 L1060 380 L1200 430 L1320 400 L1440 450 L1440 600 L0 600 Z"
          fill="url(#mountainGrad2)"/>

    <!-- 近山 -->
    <path d="M0 510 L110 470 L230 490 L340 430 L460 470 L580 420 L720 460 L860 420 L1000 470 L1140 430 L1280 480 L1400 460 L1440 490 L1440 600 L0 600 Z"
          fill="url(#mountainGrad1)"/>

    <!-- 山脚雾气 -->
    <path d="M0 540 Q300 510 600 530 T1440 520 L1440 600 L0 600 Z"
          fill="#f3ecda" opacity=".7"/>
  </svg>
</div>

<div class="seal fade-in">待启</div>

<main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 text-center">
  <h1 class="brush-title fade-in delay-1">网站建设中</h1>
  <p class="sub-title fade-in delay-2 mt-5">匠心打磨，即将呈现</p>
  <button class="expect-btn fade-in delay-3 mt-8">敬请期待</button>
</main>

<script>
  // 金色粒子特效
  function createParticle(){
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.top = 55 + Math.random() * 30 + "vh";
    document.body.appendChild(p);

    const dx = (Math.random() - 0.5) * 140;
    const dy = -100 - Math.random() * 140;
    const dur = 4500 + Math.random() * 3000;

    p.animate([
      { transform: "translate(0,0) scale(.4)", opacity: 0 },
      { opacity: .9, offset: .25 },
      { transform: `translate(${dx}px, ${dy}px) scale(1.1)`, opacity: 0 }
    ], {
      duration: dur,
      easing: "cubic-bezier(.2,.7,.3,1)"
    }).onfinish = () => p.remove();
  }

  setInterval(createParticle, 500);
</script>

</body>
</html>
