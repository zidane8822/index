<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>样子懂了</title>
<meta name="description" content="一个国风视觉展示页：烟雨远山，静观其变。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='2' fill='%23A63A2E'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='%23F7F3EE' font-family='serif'%3E%E6%A5%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
:root{
  --paper:#F2F1EC;
  --paper-2:#E8E7E0;
  --ink:#232A28;
  --ink-2:#5A635E;
  --ink-3:#8B928B;
  --mist:#C7D2CD;
  --hill:#4A5E57;
  --seal:#A63A2E;
  --line:#D5D6CE;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  line-height:1.8;
  overflow-x:hidden;
}
img{display:block;max-width:100%}

/* ===== 首屏 ===== */
.hero{
  position:relative;
  min-height:92vh;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.hero::before{
  content:"";
  position:absolute;inset:0;
  background:url("https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/EcZkbhIbAoQDhIx6wAAcUIpCnfF") center/cover no-repeat;
}
.hero::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(242,241,236,.16) 0%,rgba(242,241,236,.28) 45%,var(--paper) 100%);
}
.hero-inner{
  position:relative;z-index:1;
  text-align:center;
  padding:0 24px;
}
/* 印章：端正一方，落在右下 */
.seal{
  width:56px;height:56px;
  background:var(--seal);
  color:#F7F3EE;
  display:grid;place-items:center;
  font-family:var(--serif);
  font-size:30px;font-weight:700;line-height:1;
  border-radius:2px;
  box-shadow:inset 0 0 0 4px rgba(247,243,238,.15), 0 2px 12px rgba(166,58,46,.2);
}
h1{
  font-weight:700;
  font-size:clamp(38px,8vw,72px);
  letter-spacing:.18em;
  line-height:1.2;
  text-indent:.18em;
  color:var(--ink);
  text-shadow:0 1px 14px rgba(242,241,236,.85);
}
.rule{
  width:56px;height:2px;background:var(--seal);
  margin:26px auto 24px;
}
.hero-sub{
  font-size:clamp(15px,2.2vw,19px);
  font-weight:400;
  letter-spacing:.12em;
  color:var(--ink-2);
  line-height:2.1;
}
.side-note{
  position:absolute;
  right:26px;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;
  font-size:14px;letter-spacing:.34em;
  color:var(--ink-3);
  z-index:1;
}
@media (max-width:640px){.side-note{display:none}}

/* ===== 诗句 ===== */
.poem{
  max-width:820px;
  margin:0 auto;
  padding:96px 24px 88px;
  text-align:center;
}
.poem-line{
  font-size:clamp(21px,3.4vw,30px);
  font-weight:600;
  letter-spacing:.18em;
  text-indent:.18em;
  line-height:2.3;
  color:var(--ink);
}
.poem-line + .poem-line{margin-top:10px}
.poem::before,
.poem::after{
  content:"";
  display:block;
  width:120px;height:1px;background:var(--line);
  margin:0 auto 34px;
}
.poem::after{margin:34px auto 0}

/* ===== 挂轴图 ===== */
.scroll-painting{
  max-width:1080px;
  margin:0 auto;
  padding:0 24px 96px;
}
.scroll-painting figure{
  border:1px solid var(--line);
  background:var(--paper-2);
  padding:10px;
  box-shadow:0 18px 40px rgba(74,94,87,.14);
}
.scroll-painting img{
  width:100%;height:380px;
  object-fit:cover;object-position:center 30%;
}
@media (max-width:640px){
  .scroll-painting img{height:240px}
}

/* ===== 收尾 ===== */
.end{
  position:relative;
  text-align:center;
  padding:64px 24px 88px;
}
.end-main{
  font-size:clamp(26px,4vw,38px);
  font-weight:700;
  letter-spacing:.24em;
  text-indent:.24em;
  color:var(--ink);
  margin-bottom:18px;
}
.end-sub{
  font-size:15px;
  letter-spacing:.2em;
  color:var(--ink-3);
}
.end .seal{
  position:absolute;
  right:clamp(24px,7vw,110px);
  bottom:34px;
}
@media (max-width:640px){
  .end .seal{position:static;margin:30px auto 0}
}
</style>
</head>
<body>

  <!-- 首屏：山水 -->
  <header class="hero">
    <span class="side-note">烟雨　静观</span>
    <div class="hero-inner">
      <h1>样子懂了</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="hero-sub">云漫青山，风渡闲窗；<br>世间纷杂，静观其变。</p>
    </div>
  </header>

  <!-- 诗句 -->
  <section class="poem">
    <p class="poem-line">山有归期，云无定向。</p>
    <p class="poem-line">心有所悟，即是归途。</p>
  </section>

  <!-- 挂轴 -->
  <section class="scroll-painting">
    <figure>
      <img src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/EcZkbhIbAoQDhIx6wAAcUIpCnfF" alt="烟雨远山：层山隐于云雾，山脚疏树小亭">
    </figure>
  </section>

  <!-- 收尾 -->
  <footer class="end">
    <p class="end-main">懂了，就好。</p>
    <p class="end-sub">二〇二六年 · 冬</p>
    <div class="seal" aria-label="楊">楊</div>
  </footer>

</body>
</html>
