<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>样子懂了</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#f3f6f4;
    --paper:#f8faf8;
    --text:#2c3532;
    --muted:#606c68;
    --accent:#b84238;
    --blue-hill:#475c58;
    --border:#d8e0dd;
    --shadow: 0 8px 24px rgba(72,92,88,0.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family: "Noto Sans SC", system-ui, sans-serif;
    background-color: var(--bg);
    background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 60 Q30 50,60 60 T120 60' stroke='%23d0dbd7' fill='none' stroke-width='0.5' opacity='0.35'/%3E%3Cpath d='M60 0 Q50 30,60 60 T60 120' stroke='%23d0dbd7' fill='none' stroke-width='0.5' opacity='0.25'/%3E%3C/svg%3E");
    color:var(--text);
    line-height:1.8;
}
.container{
    max-width:1160px;
    margin:0 auto;
    padding:0 24px;
}
/* 首屏卷轴区域 */
.hero{
    min-height: 420px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 60px 0;
    gap:40px;
}
.hero-text{
    flex:1;
}
.hero-title{
    font-family: "Noto Serif SC", serif;
    font-size:64px;
    font-weight:700;
    letter-spacing:12px;
    color:var(--blue-hill);
    margin-bottom:20px;
}
.hero-desc{
    font-family: "Noto Serif SC", serif;
    font-size:18px;
    color:var(--muted);
    line-height:2.2;
    max-width:520px;
}
.hero-img{
    width:360px;
    height:280px;
    border-radius:12px;
    background:linear-gradient(135deg,#c8d8d4,#e8efec);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:var(--shadow);
}
.hero-img svg{width:100%;height:100%;}
/* 搜索框 */
.search-wrap{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px 28px;
    box-shadow:var(--shadow);
    margin-bottom:36px;
}
.search-box{
    display:flex;
    gap:12px;
    align-items:center;
}
.search-input{
    flex:1;
    padding:14px 18px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:16px;
    outline:none;
    background:#fff;
}
.search-input:focus{border-color:var(--blue-hill)}
.search-select{
    padding:14px 10px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
}
.search-btn{
    padding:14px 24px;
    background:var(--blue-hill);
    color:#fff;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
}
.search-btn:hover{background:#384946}
/* 导航卡片区 */
.nav-section{
    margin-bottom:40px;
}
.section-title{
    font-family: "Noto Serif SC", serif;
    font-size:22px;
    letter-spacing:4px;
    margin-bottom:18px;
    color:var(--blue-hill);
    display:flex;
    align-items:center;
    gap:12px;
}
.section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg,var(--border),transparent);
}
.nav-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}
.nav-card{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    text-decoration:none;
    color:var(--text);
    transition:0.3s;
    box-shadow:var(--shadow);
}
.nav-card:hover{
    transform: translateY(-4px);
    border-color:var(--accent);
}
.nav-card h4{
    font-family: "Noto Serif SC", serif;
    font-size:17px;
    margin-bottom:6px;
}
.nav-card p{font-size:13px;color:var(--muted)}
/* 侧边信息栏：时间、天气、一言 */
.side-row{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:20px;
    margin:40px 0;
}
.info-card{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    box-shadow:var(--shadow);
}
.info-card h3{
    font-family: "Noto Serif SC", serif;
    font-size:16px;
    color:var(--blue-hill);
    margin-bottom:12px;
    letter-spacing:2px;
}
.info-content{font-size:15px;color:var(--muted);line-height:1.9;}
.hitokoto{cursor:pointer;}
/* 页脚 */
footer{
    margin-top:80px;
    padding:40px 0;
    text-align:center;
    border-top:1px solid var(--border);
    color:var(--muted);
}
.footer-text{
    font-family: "Noto Serif SC", serif;
    font-size:17px;
    line-height:2.2;
    margin-bottom:12px;
}
.footer-main{
    font-family: "Noto Serif SC", serif;
    font-size:26px;
    color:var(--accent);
    letter-spacing:6px;
}
/* 响应式 */
@media(max-width:900px){
    .hero{flex-direction:column;text-align:center}
    .hero-title{font-size:46px}
    .nav-grid{grid-template-columns:repeat(2,1fr)}
    .side-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
    <!-- 首屏 -->
    <section class="hero">
        <div class="hero-text">
            <h1 class="hero-title">样子懂了</h1>
            <div class="hero-desc">
                云漫青山，风渡闲窗。<br>
                世间万般纷杂，择一隅静处，寻所知，观所遇，心有澄明，便是懂了。
            </div>
        </div>
        <div class="hero-img">
            <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                <path d="M-10 220 Q100 160, 200 200 T410 180" stroke="#889e9a" fill="none" stroke-width="2"/>
                <path d="M20 240 Q140 190, 260 220 T400 210" stroke="#a2b8b4" fill="none" stroke-width="1.5"/>
                <path d="M80 250 Q180 220, 300 240 T420 230" stroke="#b9cbc8" fill="none" stroke-width="1"/>
                <circle cx="330" cy="70" r="22" fill="#e9e9e7" opacity="0.7"/>
                <path d="M290 100 Q310 85, 340 95" stroke="#889e9a" fill="none" stroke-width="1"/>
            </svg>
        </div>
    </section>

    <!-- 搜索 -->
    <div class="search-wrap">
        <div class="search-box">
            <input class="search-input" id="searchInput" placeholder="输入内容搜索，按回车确认">
            <select class="search-select" id="searchEngine">
                <option value="https://www.baidu.com/s?wd=">百度</option>
                <option value="https://cn.bing.com/search?q=">必应</option>
                <option value="https://sogou.com/web?query=">搜狗</option>
            </select>
            <button class="search-btn" id="searchBtn">搜索</button>
        </div>
    </div>

    <!-- 导航 只保留三组 -->
    <div class="nav-section">
        <h2 class="section-title">常用</h2>
        <div class="nav-grid">
            <a class="nav-card" href="https://tophub.today/" target="_blank">
                <h4>今日热榜</h4>
                <p>每日热门话题</p>
            </a>
            <a class="nav-card" href="https://tv.zz223.eu.org/" target="_blank">
                <h4>LibreTv</h4>
                <p>在线观影平台</p>
            </a>
            <a class="nav-card" href="https://uutool.cn/" target="_blank">
                <h4>在线工具</h4>
                <p>好用工具箱</p>
            </a>
            <a class="nav-card" href="https://github.com/zidane8822" target="_blank">
                <h4>GitHub</h4>
                <p>代码仓库</p>
            </a>
        </div>
    </div>

    <div class="nav-section">
        <h2 class="section-title">找资料</h2>
        <div class="nav-grid">
            <a class="nav-card" href="https://www.baidu.com/" target="_blank">
                <h4>百度</h4>
                <p>综合检索</p>
            </a>
            <a class="nav-card" href="https://cn.bing.com/" target="_blank">
                <h4>必应</h4>
                <p>外文资料</p>
            </a>
            <a class="nav-card" href="https://www.zhihu.com/" target="_blank">
                <h4>知乎</h4>
                <p>经验问答</p>
            </a>
            <a class="nav-card" href="https://zh.wikipedia.org/" target="_blank">
                <h4>维基百科</h4>
                <p>百科查阅</p>
            </a>
        </div>
    </div>

    <div class="nav-section">
        <h2 class="section-title">看东西</h2>
        <div class="nav-grid">
            <a class="nav-card" href="https://www.bilibili.com/" target="_blank">
                <h4>哔哩哔哩</h4>
                <p>视频观看</p>
            </a>
            <a class="nav-card" href="https://www.xiaoyuzhoufm.com/" target="_blank">
                <h4>小宇宙</h4>
                <p>播客收听</p>
            </a>
            <a class="nav-card" href="https://music.163.com/" target="_blank">
                <h4>网易云音乐</h4>
                <p>音乐</p>
            </a>
            <a class="nav-card" href="https://www.youtube.com/" target="_blank">
                <h4>YouTube</h4>
                <p>海外视频</p>
            </a>
        </div>
    </div>

    <!-- 信息栏：时间、天气、一言 -->
    <div class="side-row">
        <div class="info-card">
            <h3>此刻</h3>
            <div class="info-content" id="clock">--:--:--</div>
        </div>
        <div class="info-card">
            <h3>天时</h3>
            <div class="info-content" id="weather">加载中...</div>
        </div>
        <div class="info-card">
            <h3>片语</h3>
            <div class="info-content hitokoto" id="hitokoto">加载中，点击换一句</div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer>
        <div class="footer-text">山有归期，云无定向。</div>
        <div class="footer-main">心有所悟，即是归途。</div>
    </footer>
</div>

<script>
// 时钟（本地计算，稳定可用）
function updateClock(){
    try{
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth()+1).padStart(2,'0');
        const d = String(now.getDate()).padStart(2,'0');
        const h = String(now.getHours()).padStart(2,'0');
        const mi = String(now.getMinutes()).padStart(2,'0');
        const s = String(now.getSeconds()).padStart(2,'0');
        document.getElementById("clock").innerText = `${y}年${m}月${d}日 ${h}:${mi}:${s}`;
    }catch(e){}
}
updateClock();
setInterval(updateClock,1000);

// 搜索
const input = document.getElementById("searchInput");
const engine = document.getElementById("searchEngine");
const btn = document.getElementById("searchBtn");
function doSearch(){
    const wd = input.value.trim();
    if(!wd){
        window.open(engine.value.replace("?wd=","").replace("?query=","").replace("?q=",""),"_blank");
        return;
    }
    window.open(engine.value + encodeURIComponent(wd),"_blank");
}
btn.onclick = doSearch;
input.onkeydown = e=>{if(e.key==="Enter") doSearch();}

// 天气 潮州 23.62,116.68
async function loadWeather(){
    const el = document.getElementById("weather");
    try{
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=23.62&longitude=116.68&current=temperature_2m,relative_humidity_2m,wind_speed_10m");
        if(!res.ok) throw 1;
        const data = await res.json();
        const cur = data.current;
        el.innerText = `${cur.temperature_2m}℃ | 湿度 ${cur.relative_humidity_2m}% | 风速 ${cur.wind_speed_10m} m/s`;
    }catch{
        el.innerText = "网络不畅，暂无法获取天气";
    }
}
loadWeather();

// 一言
const hitokotoEl = document.getElementById("hitokoto");
async function getHitokoto(){
    try{
        const res = await fetch("https://v1.hitokoto.cn/?c=d&c=i");
        if(!res.ok) throw 1;
        const d = await res.json();
        hitokotoEl.innerText = d.hitokoto;
    }catch{
        const arr = ["静看云起，慢待时光","一念清净，万事从容","清风入怀，自在安然"];
        hitokotoEl.innerText = arr[Math.floor(Math.random()*arr.length)];
    }
}
getHitokoto();
hitokotoEl.onclick = getHitokoto;
</script>
</body>
</html>
